name: Fetch Live Scores

on:
  schedule:
    # Every hour, on the hour.
    - cron: "0 * * * *"
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab
  repository_dispatch:
    # Mirrors SlickDealsTracker's "trigger-deals-pull" pattern -- fire this
    # from anywhere (Apps Script, another workflow, curl) with:
    #   POST https://api.github.com/repos/mzaiger/FootballDashboard/dispatches
    #   { "event_type": "trigger-scores-pull" }
    types: [trigger-scores-pull]

permissions:
  contents: write

jobs:
  fetch-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch scores.json
        run: python scripts/fetch_scores.py

      - name: Commit updated scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scores.json
          git diff --staged --quiet || git commit -m "Update live scores [automated]"
          git push
