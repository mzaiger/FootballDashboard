name: Update Betting Dashboards

on:
  schedule:
    # 10:00 UTC daily (~5am Central). Adjust to taste.
    - cron: "0 10 * * *"
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build CFB dashboard.json
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
        run: python scripts/build_dashboard.py

      - name: Build NFL nfl_dashboard.json
        env:
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
        run: python scripts/build_nfl_dashboard.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/nfl_dashboard.json
          git diff --staged --quiet || git commit -m "Update dashboard data [automated]"
          git push
