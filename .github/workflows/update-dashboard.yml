name: Update Betting Dashboards

on:
  schedule:
    # 8am / 2pm / 8pm Central (Central Daylight Time = UTC-5, so that's
    # 13:00 / 19:00 / 01:00 UTC). Central shifts to UTC-6 outside DST
    # (roughly early Nov - early March), which would run this an hour
    # later than intended those months -- shift these by 1 hour if that
    # matters to you (GitHub Actions cron is always UTC, it doesn't
    # follow DST on its own).
    - cron: "0 13 * * *"
    - cron: "0 19 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab

concurrency:
  group: shared-repo-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build NCAAF ncaaf_dashboard.json
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python scripts/build_ncaaf_dashboard.py

      - name: Build NFL nfl_dashboard.json
        env:
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python scripts/build_nfl_dashboard.py

      - name: Build MLB mlb_dashboard.json
        env:
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python scripts/build_mlb_dashboard.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ncaaf_dashboard.json data/nfl_dashboard.json data/mlb_dashboard.json
          # Only exists once a Gemini call has actually happened (e.g. GEMINI_KEY
          # unset, or every game was already cached) -- don't fail the step over it.
          if [ -f data/gemini_predictions_cache.json ]; then
            git add data/gemini_predictions_cache.json
          fi
          git diff --staged --quiet || git commit -m "Update dashboard data [automated]"
          git push
